name: Earthquake Alert

on:
  schedule:
    - cron: '*/5 * * * *'  # รันทุก 5 นาที
  workflow_dispatch:  # สามารถรันด้วยตัวเองได้

jobs:
  check-earthquake:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Cache earthquake history
        uses: actions/cache@v4
        with:
          path: sent_earthquakes.json
          key: earthquake-history-${{ github.run_id }}
          restore-keys: |
            earthquake-history-
      
      - name: Run earthquake alert
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python earthquake_alert.py

name: Earthquake Auto Alert

on:
  workflow_dispatch:

concurrency:
  group: earthquake-auto-alert
  cancel-in-progress: false

jobs:
  check-earthquake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore earthquake history
        id: earthquake-history
        uses: actions/cache/restore@v4
        with:
          path: sent_earthquakes.json
          key: earthquake-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            earthquake-history-${{ runner.os }}-

      - name: Ensure history file exists
        run: |
          if [ ! -f sent_earthquakes.json ]; then
            printf '[]\n' > sent_earthquakes.json
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run earthquake alert
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_GROUP_IDS: ${{ secrets.LINE_GROUP_IDS }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: python earthquake_alert.py

      - name: Save earthquake history
        if: ${{ success() && hashFiles('sent_earthquakes.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: sent_earthquakes.json
          key: earthquake-history-${{ runner.os }}-${{ github.run_id }}

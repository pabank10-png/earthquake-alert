name: Earthquake Auto Alert

on:
  workflow_dispatch:

jobs:
  check-earthquake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- เพิ่มส่วนนี้เข้าไป ---
      - name: Cache earthquake history
        uses: actions/cache@v4
        with:
          path: sent_earthquakes.json
          key: earthquake-history-${{ runner.os }}
          restore-keys: |
            earthquake-history-
      # ------------------------

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run earthquake alert
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: python earthquake_alert.py

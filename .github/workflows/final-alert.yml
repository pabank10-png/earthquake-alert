name: Earthquake Auto Alert

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earthquake-auto-alert
  cancel-in-progress: false

jobs:
  check-earthquake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure history file exists
        run: |
          if [ ! -f sent_earthquakes.json ]; then
            printf '[]\n' > sent_earthquakes.json
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest -v test_earthquake_alert.py

      - name: Run earthquake alert
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_GROUP_IDS: ${{ secrets.LINE_GROUP_IDS }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: python earthquake_alert.py

      - name: Commit earthquake history
        if: ${{ success() && hashFiles('sent_earthquakes.json') != '' }}
        run: |
          if git diff --quiet -- sent_earthquakes.json; then
            echo "No history changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_earthquakes.json
          git commit -m "chore: update earthquake history [skip ci]"
          git push

